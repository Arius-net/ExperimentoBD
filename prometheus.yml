# Prometheus - telemetría del benchmark (scrape cada 1s, ver Contexto/contexto_del_experimento.md)
global:
  scrape_interval: 1s
  # scrape_timeout debe ser <= scrape_interval (por defecto es 10s y Prometheus rechazaría la config)
  scrape_timeout: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
